name: Flutter Build and Release

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. Extract Version from pubspec.yaml safely
      - name: Get version from pubspec
        id: pubspec_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/^version: //' | tr -d '\r')
          echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT
          echo "display_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 2. Decode the Keystore into android/app/
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.jks

      # 3. Build the APK with quoted dart-defines
      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --dart-define=SIGNING_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
            --dart-define=SIGNING_KEY_ALIAS="$KEY_ALIAS" \
            --dart-define=SIGNING_KEY_PASSWORD="$KEY_PASSWORD"

      # 4. Create Release using softprops/action-gh-release@v2
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pubspec_version.outputs.tag_name }}
          name: Release ${{ steps.pubspec_version.outputs.display_version }}
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}